title = "Family Music Home source scan"
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Generated source inventory lines contain SHA-256 file digests, not credentials"
condition = "AND"
paths = ['''(^|/)SOURCE_MANIFEST\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[A-Za-z0-9_./@+()$# -]+": "[a-f0-9]{64}",?\s*$''']
